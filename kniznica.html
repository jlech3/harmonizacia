<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#16131C">
  <title>Knižnica piesní — Harmonizácia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <a class="brand" href="index.html" aria-label="Harmonizácia — domov">
        <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><path d="M9 9l12-2"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
        <span class="wordmark">Harmonizácia</span>
      </a>
      <button class="avatar" type="button" aria-label="Účet (čoskoro)" title="Účet — čoskoro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/></svg></button>
    </nav>

    <div class="lib-head">
      <div>
        <p class="eyebrow" id="libCount">Knižnica</p>
        <h1 class="display" style="font-size:clamp(2.2rem,4vw+1rem,3.4rem)">Knižnica piesní</h1>
      </div>
      <a class="btn btn-grad" href="editor.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Nová pieseň
      </a>
    </div>

    <div class="toolbar">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        <input id="search" type="search" placeholder="Hľadať pieseň, autora alebo región…" autocomplete="off" spellcheck="false" aria-label="Hľadať">
      </label>
      <div class="seg" id="filters" role="group" aria-label="Filter obtiažnosti">
        <button type="button" data-f="all" aria-pressed="true">Všetky</button>
        <button type="button" data-f="zaciatocnik" aria-pressed="false">Začiatočník</button>
        <button type="button" data-f="pokrocily" aria-pressed="false">Pokročilý</button>
      </div>
    </div>

    <section class="song-grid" id="grid" aria-label="Zoznam piesní"></section>
    <p class="empty" id="empty" hidden>Nič sa nenašlo. Skús iný filter alebo <a href="editor.html">vytvor novú pieseň</a>.</p>

    <footer class="foot">
      <span>Knižnica — tvoje harmonizácie</span>
      <span>v1 · lokálne</span>
    </footer>
  </div>

  <script src="js/theory.js"></script>
  <script src="js/store.js"></script>
  <script src="js/kniznica.js"></script>
</body>
</html>
